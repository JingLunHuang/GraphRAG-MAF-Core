name: Validate and compile Native AOT
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Locked restore and tests
        run: |
          dotnet restore tests/GraphRag.Tests --locked-mode
          dotnet restore src/GraphRag.Cli --locked-mode
          dotnet test tests/GraphRag.Tests -c Release --no-restore --logger 'trx;LogFileName=unit-tests.trx' --results-directory artifacts/test-results
      - name: API, CLI and stdio MCP
        run: |
          dotnet run --project src/GraphRag.Cli -c Release --no-restore -- smoke --output artifacts/smoke.json
          dotnet run --project src/GraphRag.Cli -c Release --no-build -- benchmark --output artifacts/vector-benchmark.json
          DOTNET_EXE=dotnet CLI_DLL=src/GraphRag.Cli/bin/Release/net10.0/GraphRag.Cli.dll node scripts/smoke-mcp-stdio.mjs
      - name: Compile and exercise real Native AOT binary
        run: |
          dotnet restore src/GraphRag.Api -r linux-x64 -p:PublishAot=true --locked-mode
          dotnet publish src/GraphRag.Api -c Release -r linux-x64 --no-restore -p:PublishAot=true -p:TrimmerSingleWarn=false -o artifacts/native/linux-x64
          bash scripts/ci-native-smoke.sh
      - name: Compose validation
        env:
          NEO4J_PASSWORD: ci-test-password
          APP_API_KEY: ci-test-api-key
        run: docker compose config --quiet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-evidence
          path: |
            artifacts/*.json
            artifacts/test-results/*.trx
            artifacts/logs/*.log
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64/
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: graphrag-api:ci
          cache-from: type=gha,scope=docker-ci-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=docker-ci-${{ github.ref_name }}
      - name: Smoke-test built container image
        env:
          APP_API_KEY: test
        run: |
          docker run --detach --name graphrag-ci-smoke --publish 127.0.0.1:18083:8080 \
            --env AI_PROVIDER=fixture --env EMBEDDING_PROVIDER=fixture --env GRAPH_STORE=memory \
            --env APP_API_KEY="$APP_API_KEY" \
            graphrag-api:ci
          trap 'docker rm -f graphrag-ci-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fs --max-time 2 http://127.0.0.1:18083/health/ready -o /tmp/graphrag-ci-ready.json && \
              python3 -c 'import json; d=json.load(open("/tmp/graphrag-ci-ready.json")); assert d["nativeAot"] and d["status"] == "ready" and d["graphStore"] == "memory"'; then
              echo "CI-built Native AOT image is ready."
              exit 0
            fi
            sleep 1
          done
          docker logs graphrag-ci-smoke
          exit 1
